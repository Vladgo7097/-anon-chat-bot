# Линтер подобран под код, а не наоборот: правила выбраны так, чтобы ловить
# дефекты, а не переписывать стиль.
#
# Почему не дефолт: `ruff check` без конфига даёт 146 находок в ядре, из них
# 87 -- сортировка импортов (I001) и 13 -- `except Exception` в retry-воркерах,
# где слепой except намеренный и правильный. Такой линтер не читают, и он
# прячет настоящие находки под шумом.

# p90 реальных строк проекта -- 86, так что дефолтная ширина совпадает с кодом
# и менять её незачем.
line-length = 88

exclude = [
  ".git",
  ".venv",
  "__pycache__",
  ".playwright-mcp",
  ".pytest_cache",
]

[lint]
select = [
  "F401",   # импорт есть, использования нет -- 19 в ядре
  "F811",   # имя переприсваивается до того, как было прочитано -- 5 в ядре
  "S110",   # try/except/pass молча глотает ошибку -- 1 в ядре
  "B0",     # bugbear: замыкание на переменную цикла, мутабельный default
]

[lint.per-file-ignores]
# Тесты намеренно держат широкие импорты, заглушки и лямбды в side_effect,
# которые ruff видит как захват переменной цикла, хотя вызываются в итерации.
"tests/**" = ["F401", "S110", "B023"]
