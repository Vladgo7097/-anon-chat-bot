name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      test-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anon_chat_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d anon_chat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      test-redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://test:isolated_test_only@localhost:5432/anon_chat_test
      REDIS_URL: redis://localhost:6379/0
      RUN_POSTGRES_TESTS: "1"
      RUN_STRESS_TESTS: "0"
      BOT_TOKEN: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Run unit and PostgreSQL integration tests
        run: python -m pytest -q
