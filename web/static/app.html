<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анонимный чат</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<div class="atmosphere"><div class="glow-a"></div><div class="glow-b"></div></div>
<div class="grain"></div>

<div class="app-shell page">
  <div id="onboarding-banner" class="card-glass banner" hidden>
    Заверши регистрацию в Telegram-боте — там пара шагов (пол, возраст, правила),
    и можно будет искать собеседника отсюда.
    <div style="margin-top:16px;"><a class="btn btn-primary" href="https://t.me/anonim_chatqbot" target="_blank" rel="noopener">Открыть бота</a></div>
  </div>

  <div id="app-frame" class="app-frame card-glass" hidden>
    <div class="app-header glass-bar">
      <div class="logo mono" style="font-size:15px;"><span>АНОНИМ</span><span style="color:var(--accent)">_ЧАТ</span></div>
      <div style="display:flex;align-items:center;gap:16px;">
        <span id="my-id" class="mono" style="font-size:12px;color:var(--muted);"></span>
        <button id="logout-btn" class="icon-btn" title="Выйти" style="width:34px;height:34px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <!-- search -->
    <div id="search-view" class="search-view">
      <div class="search-ring-wrap">
        <div id="ring1" class="search-ring" hidden></div>
        <div id="ring2" class="search-ring r2" hidden></div>
        <div id="ring3" class="search-ring r3" hidden></div>
        <div class="card-glass" style="width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>
      <div id="search-status" class="mono" style="font-size:13px;letter-spacing:.15em;color:var(--muted);" hidden>ИЩУ СОБЕСЕДНИКА…</div>
      <div id="search-timer" class="serif mono search-timer" hidden>00:00</div>
      <div id="search-online" class="search-online" hidden><span class="dot"></span><span id="online-count">—</span></div>
      <button id="start-search-btn" class="btn btn-primary">Найти собеседника</button>
      <button id="cancel-search-btn" class="btn btn-ghost" hidden>Отменить поиск</button>
    </div>

    <!-- chat -->
    <div id="chat-view" class="chat-view" hidden>
      <div id="thread" class="thread"></div>
      <div class="composer glass-bar">
        <button id="end-chat-btn" class="icon-btn btn-danger" title="Завершить диалог">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 6 6 18M6 6l12 12" stroke-linecap="round"/></svg>
        </button>
        <button id="photo-btn" class="icon-btn" title="Отправить фото">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="1.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 17 5-5 3.5 3.5L17 11l3 3" stroke-linejoin="round"/></svg>
        </button>
        <input id="photo-input" type="file" accept="image/*" hidden>
        <input id="text-input" type="text" placeholder="Сообщение…" maxlength="4096" autocomplete="off">
        <button id="send-btn" class="send-btn" title="Отправить">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a1310" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="/js/site.js"></script>
</body>
</html>
